<style>
/* ============================================================================
   Tokens — tomados tal cual de reservas-clientes-clic-v2/src/styles/globals.css
   ========================================================================== */
:root{
  --bg:#edece7; --surface:#fdfbfa; --beige:#dfd4ca; --beige-soft:#e8e0d6;
  --taupe:#bcac9e; --taupe-dark:#9a8a7c;
  --ink:#2c2f34; --ink-deep:#23222b; --ink-soft:#5a5d62; --ink-mute:#9a9da2;
  --line:#e0d8cd; --line-soft:#ebe5db;
  --sage:#8a9a82; --sage-bg:#e6ebe2;
  --terracotta:#b87560; --terracotta-bg:#f0e0d8;
  --font-sans:'Poppins',system-ui,-apple-system,sans-serif;
  --font-serif:'Prata',Georgia,'Times New Roman',serif;
  --shadow-soft:0 18px 40px -18px rgba(44,47,52,.18),0 6px 16px -8px rgba(44,47,52,.08);
  --shadow-strong:0 30px 60px -22px rgba(44,47,52,.4),0 12px 25px -10px rgba(44,47,52,.25);
  --radius-sm:10px; --radius-md:16px; --radius-lg:22px; --radius-xl:28px; --radius-pill:999px;
  --container:1180px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-sans);font-weight:400;font-size:14px;line-height:1.5;
  color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
::selection{background:var(--ink);color:var(--surface)}

/* grano global, igual que la landing actual */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.028;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ===== Tipografía ===== */
.t-serif{font-family:var(--font-serif);font-weight:400;letter-spacing:0}
.t-display{font-weight:300;letter-spacing:-.6px;line-height:1.05}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--taupe-dark);font-weight:500}
.eyebrow--light{color:rgba(255,255,255,.65)}
.muted{color:var(--ink-soft)}

/* ===== Layout ===== */
.container{width:100%;max-width:var(--container);margin:0 auto;padding:0 32px}
.section{padding:110px 0}
section[id],div[id]{scroll-margin-top:90px}
.section--tight{padding:72px 0}
.section-head{max-width:620px;margin-bottom:48px}
.section-head h2{font-family:var(--font-serif);font-size:44px;line-height:1.12;margin-top:12px}
.section-head p{margin-top:18px;font-size:15px;color:var(--ink-soft);line-height:1.65}
.divider{display:flex;align-items:center;gap:14px}
.divider__line{flex:1;height:1px;background:rgba(35,34,43,.14)}

/* ===== Botones ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:16px 34px;border-radius:var(--radius-pill);font-size:11px;font-weight:600;
  letter-spacing:.15em;text-transform:uppercase;white-space:nowrap;
  transition:transform .15s,background .2s,color .2s,border-color .2s,opacity .2s}
.btn:hover{transform:translateY(-1px)}
.btn--primary{background:var(--ink);color:var(--surface)}
.btn--primary:hover{background:#1d1f23}
.btn--light{background:#fff;color:var(--ink-deep)}
.btn--ghost{border:1px solid var(--ink);color:var(--ink)}
.btn--ghost:hover{background:var(--ink);color:var(--surface)}
.btn--ghost-light{border:1px solid rgba(255,255,255,.4);color:#fff}
.btn--ghost-light:hover{background:#fff;color:var(--ink-deep)}
.btn--sm{padding:12px 24px;font-size:10px}
.btn--full{width:100%}

/* ===== Header ===== */
.hdr{position:fixed;top:0;left:0;right:0;z-index:200;transition:background .3s,border-color .3s,backdrop-filter .3s}
.hdr__inner{display:flex;align-items:center;justify-content:space-between;height:82px;transition:height .3s}
.hdr__brand{display:flex;align-items:center;gap:14px}
.hdr__logo{height:26px;width:auto;transition:height .3s}
.hdr--solid .hdr__logo{height:22px}
.hdr__logo--dark{display:none}
.hdr--solid .hdr__logo--light{display:none}
.hdr--solid .hdr__logo--dark{display:block}
.hdr__tag{font-size:9px;letter-spacing:.24em;text-transform:uppercase;padding-left:14px;
  border-left:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.6);padding-top:2px;transition:color .3s,border-color .3s}
.hdr__nav{display:flex;align-items:center;gap:30px}
.hdr__link{font-size:11px;font-weight:500;letter-spacing:.08em;color:rgba(255,255,255,.8);
  padding:6px 0;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.hdr__link:hover{color:#fff;border-bottom-color:currentColor}
.hdr__actions{display:flex;align-items:center;gap:22px}
.hdr__login{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.75);border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.hdr__login:hover{color:#fff;border-bottom-color:#fff}
.hdr__burger{display:none;width:26px;height:16px;position:relative}
.hdr__burger span{position:absolute;left:0;right:0;height:1.5px;background:currentColor;transition:.3s}
.hdr__burger span:nth-child(1){top:0}
.hdr__burger span:nth-child(2){top:7px}
.hdr__burger span:nth-child(3){top:14px}
/* estado sobre fondo claro / scrolleado */
.hdr--solid{background:rgba(237,236,231,.88);backdrop-filter:saturate(160%) blur(10px);border-bottom:1px solid rgba(35,34,43,.08)}
.hdr--solid .hdr__inner{height:66px}
.hdr--solid .hdr__logo{color:var(--ink)}
.hdr--solid .hdr__tag{color:var(--taupe-dark);border-left-color:var(--line)}
.hdr--solid .hdr__link{color:var(--ink-soft)}
.hdr--solid .hdr__link:hover{color:var(--ink)}
.hdr--solid .hdr__login{color:var(--ink-soft)}
.hdr--solid .hdr__login:hover{color:var(--ink)}
.hdr--solid .hdr__cta{background:var(--ink);color:var(--surface)}

/* menú mobile */
.mnav{position:fixed;inset:0;z-index:300;background:var(--ink-deep);color:#fff;
  display:flex;flex-direction:column;padding:28px 24px 40px;
  transform:translateY(-100%);transition:transform .45s cubic-bezier(.65,0,.35,1);visibility:hidden}
.mnav--open{transform:translateY(0);visibility:visible}
.mnav__top{display:flex;justify-content:space-between;align-items:center}
.mnav__close{font-size:26px;line-height:1;color:rgba(255,255,255,.7)}
.mnav__list{margin-top:auto;margin-bottom:auto;display:flex;flex-direction:column;gap:6px}
.mnav__list a{font-family:var(--font-serif);font-size:34px;line-height:1.3;color:#fff}
.mnav__foot{display:flex;flex-direction:column;gap:14px}

/* ===== Hero ===== */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;
  background:var(--ink-deep);isolation:isolate;overflow:hidden;color:#fff}
.hero__media{position:absolute;inset:0;background:linear-gradient(135deg,#c9b39a,#a8927f 45%,#6f6558);
  animation:kenburns 24s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.12) translateY(-1.5%)}}
.hero__media::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(58deg,transparent 0 26px,rgba(35,34,43,.05) 26px 27px)}
.hero__media::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,
  var(--ink-deep) 0%,rgba(35,34,43,.9) 34%,rgba(35,34,43,.5) 60%,rgba(35,34,43,.25) 82%,rgba(35,34,43,.5) 100%)}
.hero__inner{position:relative;padding-bottom:56px;padding-top:140px}
.hero__grid{display:grid;grid-template-columns:1.15fr .85fr;gap:64px;align-items:end}
.hero h1{font-family:var(--font-serif);font-size:clamp(44px,6.2vw,86px);line-height:1.03;margin-top:18px}
.hero h1 em{font-style:italic;font-family:var(--font-serif)}
.hero__sub{margin-top:24px;max-width:440px;font-size:15px;line-height:1.7;color:rgba(255,255,255,.72)}
.hero__stats{display:flex;gap:36px;margin-top:38px;flex-wrap:wrap}
.hero__stat b{display:block;font-weight:300;font-size:30px;letter-spacing:-.6px;line-height:1}
.hero__stat span{display:block;margin-top:6px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55)}

/* widget de reserva en el hero — la pieza que conecta con el backend */
.book{background:rgba(253,251,250,.97);color:var(--ink);border-radius:var(--radius-lg);
  padding:26px;box-shadow:var(--shadow-strong)}
.book__title{font-family:var(--font-serif);font-size:22px;line-height:1.2;margin-top:10px}
.book__field{margin-top:18px}
.book__label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe-dark);font-weight:500}
.book__select{width:100%;margin-top:8px;padding:14px 16px;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--radius-sm);font-size:14px;appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml,%3Csvg width='12' height='8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%235a5d62' stroke-width='1.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 16px center}
.book__peek{margin-top:16px;padding:14px 16px;background:var(--sage-bg);border-radius:var(--radius-sm);
  display:flex;align-items:center;gap:10px;font-size:12px;color:#4a6741;min-height:48px}
.book__dot{width:7px;height:7px;border-radius:50%;background:var(--sage);flex:none;
  box-shadow:0 0 0 3px rgba(138,154,130,.25);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(138,154,130,.25)}50%{box-shadow:0 0 0 7px rgba(138,154,130,0)}}
.book__note{margin-top:14px;font-size:11px;color:var(--ink-mute);text-align:center}

/* ===== Barra de confianza ===== */
.trust{background:var(--ink);color:rgba(255,255,255,.75);padding:20px 0;overflow:hidden}
.trust__track{display:flex;gap:56px;width:max-content;animation:marquee 38s linear infinite}
.trust:hover .trust__track{animation-play-state:paused}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.trust__item{display:flex;align-items:center;gap:14px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
.trust__iso{height:13px;width:auto;opacity:.75;flex:none}

/* ===== Clases de hoy ===== */
.live__bar{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:26px}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius-pill);font-size:12px;font-weight:500;
  color:var(--ink-soft);white-space:nowrap;transition:.2s}
.pill:hover{border-color:var(--taupe);color:var(--ink)}
.pill--active{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.pill--active:hover{color:var(--surface)}
.pill__count{font-size:10px;font-weight:600;padding:2px 7px;border-radius:var(--radius-pill);
  background:var(--bg);color:var(--ink-mute);min-width:20px;text-align:center}
.pill--active .pill__count{background:rgba(253,251,250,.14);color:var(--surface)}

.day-label{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-soft);margin:32px 0 14px;padding-left:4px}
.day-label:first-child{margin-top:0}
.row{display:flex;align-items:center;column-gap:20px;padding:18px 22px;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:var(--radius-md);cursor:pointer;transition:.2s}
.row+.row{margin-top:10px}
.row:hover{border-color:var(--taupe);transform:translateX(2px)}
.row__time{font-size:22px;font-weight:300;letter-spacing:-.5px;line-height:1;min-width:70px;
  padding-right:20px;border-right:1px solid var(--line)}
.row__body{flex:1;min-width:0}
.row__name{font-size:18px;line-height:1.15}
.row__meta{margin-top:5px;font-size:11px;color:var(--ink-soft);letter-spacing:.3px}
.row__cupos{display:flex;align-items:center;padding:8px 16px;background:var(--sage-bg);
  border-radius:var(--radius-sm);white-space:nowrap}
.row__cupos b{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--sage);font-weight:600}
.row__cupos--low{background:var(--terracotta-bg)}
.row__cupos--low b{color:var(--terracotta)}
.row__cupos--full{background:var(--bg);opacity:.6}
.row__cupos--full b{color:var(--ink-mute)}
.row__arrow{font-size:16px;color:var(--ink-mute);transition:.2s}
.row:hover .row__arrow{color:var(--ink);transform:translateX(4px)}
.empty{text-align:center;padding:56px 20px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius-lg)}
.empty h4{font-weight:300;font-size:22px;letter-spacing:-.6px}
.empty p{margin-top:8px;font-size:13px;color:var(--ink-soft)}

/* ===== Manifiesto de marca ===== */
/* La definición de CLIC es el activo de marca más fuerte que tienen y hoy vive
   perdida entre secciones. Acá es una pieza sola, con la voz al frente. */
.manifesto{background:var(--beige-soft);position:relative;overflow:hidden}
.manifesto__iso{position:absolute;right:-6%;top:50%;transform:translateY(-50%);
  width:min(46vw,540px);opacity:.07;pointer-events:none}
.manifesto__in{position:relative;max-width:820px}
.manifesto__word{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.manifesto__word h2{font-size:clamp(46px,7vw,92px);font-weight:600;letter-spacing:.12em;line-height:1}
.manifesto__pron{font-family:var(--font-serif);font-size:clamp(22px,3vw,34px);color:var(--taupe-dark)}
.manifesto__rule{height:1px;background:rgba(35,34,43,.18);margin:30px 0 28px;max-width:180px}
.manifesto__def{font-family:var(--font-serif);font-size:clamp(22px,2.7vw,34px);line-height:1.45}
.manifesto__def b{font-weight:400;font-style:italic}
.manifesto__foot{margin-top:34px;font-size:14px;color:var(--ink-soft);max-width:520px;line-height:1.75}

/* Banda "HACÉ EL CLIC" — el claim de la marca a tamaño de titular. */
.band{background:var(--ink-deep);color:#fff;padding:52px 0;overflow:hidden}
.band__track{display:flex;align-items:center;gap:40px;width:max-content;animation:marquee 44s linear infinite}
.band:hover .band__track{animation-play-state:paused}
.band__word{font-size:clamp(42px,7vw,88px);font-weight:600;letter-spacing:.02em;white-space:nowrap;line-height:1}
.band__word--ghost{font-family:var(--font-serif);font-weight:400;font-style:italic;color:rgba(255,255,255,.32)}
.band__iso{height:clamp(30px,5vw,58px);width:auto;opacity:.5}

/* ===== Método (editorial) ===== */
.method{display:grid;grid-template-columns:.9fr 1.1fr;gap:80px;align-items:center}
.method__media{aspect-ratio:4/5;border-radius:var(--radius-lg);position:relative;overflow:hidden;
  background:linear-gradient(150deg,#d8c4ad,#bcac9e 55%,#9a8a7c)}
.method__media::after{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,transparent 0 14px,rgba(44,47,52,.045) 14px 15px)}
.method h2{font-family:var(--font-serif);font-size:46px;line-height:1.12;margin-top:14px}
.method p{margin-top:22px;font-size:15px;line-height:1.75;color:var(--ink-soft);max-width:520px}
.method__list{margin-top:34px;border-top:1px solid var(--line)}
.method__item{display:flex;gap:22px;padding:20px 0;border-bottom:1px solid var(--line)}
.method__num{font-size:10px;letter-spacing:.2em;color:var(--taupe-dark);padding-top:4px;font-weight:500}
.method__item h4{font-size:16px;font-weight:500}
.method__item p{margin-top:5px;font-size:13px;line-height:1.6}

/* ===== Niveles ===== */
.levels{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.level{position:relative;padding:44px 40px;border-radius:var(--radius-lg);overflow:hidden;min-height:380px;
  display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s}
.level:hover{transform:translateY(-4px);box-shadow:var(--shadow-soft)}
.level--a{background:var(--surface);border:1px solid var(--line)}
.level--b{background:var(--ink-deep);color:#fff}
.level h3{font-family:var(--font-serif);font-size:34px;margin-top:14px;line-height:1.15}
.level p{margin-top:16px;font-size:14px;line-height:1.7;color:var(--ink-soft);max-width:400px}
.level--b p{color:rgba(255,255,255,.66)}
.level ul{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.level li{font-size:13px;display:flex;gap:10px;align-items:baseline;color:var(--ink-soft)}
.level--b li{color:rgba(255,255,255,.72)}
.level li::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--taupe);flex:none}
.level__foot{margin-top:auto;padding-top:32px}

/* ===== Testimonios ===== */
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.quote{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius-lg);
  padding:34px 32px;display:flex;flex-direction:column}
.quote__stars{color:var(--taupe-dark);letter-spacing:3px;font-size:12px}
.quote__text{margin-top:18px;font-family:var(--font-serif);font-size:19px;line-height:1.55}
.quote__by{margin-top:auto;padding-top:26px;display:flex;align-items:center;gap:12px}
.quote__av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#d8c4ad,#bcac9e);flex:none}
.quote__name{font-size:13px;font-weight:500}
.quote__sede{font-size:11px;color:var(--ink-mute)}

/* ===== Precios ===== */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:start}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:34px 30px;display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s,border-color .3s}
.plan:hover{transform:translateY(-4px);border-color:var(--taupe);box-shadow:var(--shadow-soft)}
.plan--hot{background:var(--ink-deep);color:#fff;border-color:var(--ink-deep)}
.plan__badge{position:absolute;top:18px;right:22px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  background:var(--taupe);color:var(--ink-deep);padding:5px 12px;border-radius:var(--radius-pill);font-weight:600}
.plan__name{font-family:var(--font-serif);font-size:26px;margin-top:12px}
.plan__sub{margin-top:8px;font-size:12px;color:var(--ink-soft);min-height:34px}
.plan--hot .plan__sub{color:rgba(255,255,255,.6)}
.plan__price{margin-top:22px;padding-top:22px;border-top:1px solid var(--line);
  font-weight:300;font-size:38px;letter-spacing:-1px;line-height:1}
.plan--hot .plan__price{border-top-color:rgba(255,255,255,.14)}
.plan__per{font-size:12px;color:var(--ink-mute);margin-top:8px}
.plan--hot .plan__per{color:rgba(255,255,255,.5)}
.plan__first{margin-top:18px;padding:14px 16px;background:var(--sage-bg);border-radius:var(--radius-sm)}
.plan--hot .plan__first{background:rgba(255,255,255,.1)}
.plan__first span{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#4a6741;font-weight:500}
.plan--hot .plan__first span{color:rgba(255,255,255,.7)}
.plan__first b{display:block;margin-top:5px;font-size:24px;font-weight:300;letter-spacing:-.6px;line-height:1;color:#3d5636}
.plan--hot .plan__first b{color:#fff}
.plan__first small{display:block;margin-top:6px;font-size:11px;color:#5f7357}
.plan--hot .plan__first small{color:rgba(255,255,255,.55)}
.plan ul{margin-top:24px;display:flex;flex-direction:column;gap:11px}

/* ===== Cómo funciona la clase de prueba ===== */
.trial{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.trial__step{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius-lg);padding:32px 28px}
.trial__step--hl{background:var(--ink-deep);color:#fff;border-color:var(--ink-deep)}
.trial__num{font-size:10px;letter-spacing:.2em;color:var(--taupe-dark);font-weight:500}
.trial__step--hl .trial__num{color:var(--taupe)}
.trial__step h4{font-family:var(--font-serif);font-size:21px;line-height:1.25;margin-top:14px}
.trial__step p{margin-top:12px;font-size:13px;line-height:1.7;color:var(--ink-soft)}
.trial__step--hl p{color:rgba(255,255,255,.68)}
.price-picker{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:34px}
.price-picker__label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe-dark);font-weight:500}
.plan li{font-size:13px;display:flex;gap:10px;align-items:baseline;color:var(--ink-soft)}
.plan--hot li{color:rgba(255,255,255,.72)}
.plan li::before{content:'—';color:var(--taupe);flex:none}
.plan__foot{margin-top:auto;padding-top:30px}

/* ===== Sedes ===== */
.sedes{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.sede{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--radius-lg);overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s}
.sede:hover{transform:translateY(-3px);border-color:var(--taupe);box-shadow:var(--shadow-soft)}
.sede__media{aspect-ratio:4/3;position:relative;overflow:hidden;background:linear-gradient(135deg,#d8c4ad,#bcac9e)}
.sede__media::after{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,transparent 0 12px,rgba(44,47,52,.04) 12px 13px)}
.sede__tagcity{position:absolute;top:14px;left:14px;z-index:2;font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;background:rgba(253,251,250,.9);padding:5px 11px;border-radius:var(--radius-pill);font-weight:500}
.sede__body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:7px;flex:1}
.sede__name{font-size:26px;line-height:1;font-weight:300;letter-spacing:-.5px}
.sede__addr{font-size:12px;color:var(--ink-soft);line-height:1.5}
.sede__foot{margin-top:auto;padding-top:20px;border-top:1px solid var(--line-soft);
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.sede__price{font-size:22px;font-weight:300;letter-spacing:-.5px;line-height:1;margin-top:4px}
.sede__cta{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  display:inline-flex;gap:6px;align-items:center;transition:color .2s}
.sede:hover .sede__cta{color:var(--taupe-dark)}

/* ===== App ===== */
.app{background:var(--ink-deep);color:#fff}
.app__grid{display:grid;grid-template-columns:1fr .8fr;gap:80px;align-items:center}
.app h2{font-family:var(--font-serif);font-size:46px;line-height:1.12;margin-top:14px}
.app p{margin-top:20px;font-size:15px;line-height:1.75;color:rgba(255,255,255,.66);max-width:460px}
.app__badges{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:11px;padding:12px 22px;border:1px solid rgba(255,255,255,.25);
  border-radius:var(--radius-sm);transition:.2s}
.badge:hover{background:#fff;color:var(--ink-deep);border-color:#fff}
.badge small{display:block;font-size:8px;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.badge b{display:block;font-size:14px;font-weight:500;line-height:1.2}
.phone{width:270px;margin:0 auto;background:#0f0e13;border-radius:38px;padding:11px;
  box-shadow:0 40px 80px -30px rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.12)}
.phone__screen{background:var(--bg);border-radius:28px;padding:22px 18px;color:var(--ink);min-height:520px}
.phone__top{display:flex;justify-content:space-between;align-items:center}
.phone__hi{font-family:var(--font-serif);font-size:22px;margin-top:22px;line-height:1.2}
.phone__card{margin-top:18px;background:var(--ink-deep);color:#fff;border-radius:var(--radius-md);padding:18px}
.phone__card b{display:block;font-size:26px;font-weight:300;letter-spacing:-.5px;margin-top:8px}
.phone__mini{margin-top:12px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--radius-sm);padding:13px 15px;display:flex;align-items:center;gap:13px}
.phone__mini b{font-size:17px;font-weight:300}
.phone__credits{margin-top:18px;display:flex;gap:10px}
.phone__credit{flex:1;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius-sm);
  padding:13px;text-align:center}
.phone__credit b{display:block;font-size:22px;font-weight:300;line-height:1}
.phone__credit span{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute)}

/* ===== Academy / Franquicias ===== */
.split{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card-cta{position:relative;border-radius:var(--radius-lg);overflow:hidden;padding:52px 44px;min-height:340px;
  display:flex;flex-direction:column;justify-content:flex-end;color:#fff;isolation:isolate}
.card-cta__bg{position:absolute;inset:0;z-index:-2;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.card-cta:hover .card-cta__bg{transform:scale(1.06)}
.card-cta::after{content:'';position:absolute;inset:0;z-index:-1;
  background:linear-gradient(to top,rgba(35,34,43,.94),rgba(35,34,43,.5) 60%,rgba(35,34,43,.25))}
.card-cta h3{font-family:var(--font-serif);font-size:34px;line-height:1.15;margin-top:12px}
.card-cta p{margin-top:14px;font-size:14px;line-height:1.65;color:rgba(255,255,255,.72);max-width:400px}
.card-cta__foot{margin-top:26px}

/* ===== Footer ===== */
.ftr{background:var(--ink-deep);color:rgba(255,255,255,.6);padding:80px 0 40px}
.ftr__grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:48px}
.ftr__logo{font-size:20px;font-weight:600;letter-spacing:.34em;color:#fff}
.ftr__bio{margin-top:18px;font-size:13px;line-height:1.7;max-width:280px}
.ftr h5{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe);margin-bottom:18px}
.ftr__list{display:flex;flex-direction:column;gap:11px}
.ftr__list a{font-size:13px;transition:color .2s}
.ftr__list a:hover{color:#fff}
.ftr__bottom{margin-top:64px;padding-top:26px;border-top:1px solid rgba(255,255,255,.1);
  display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:11px}

/* ===== CTA fija mobile ===== */
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:180;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(237,236,231,.94);backdrop-filter:blur(10px);border-top:1px solid rgba(35,34,43,.1);
  display:none;gap:12px;align-items:center;transform:translateY(110%);transition:transform .35s}
.sticky--on{transform:translateY(0)}
.sticky__price{flex:none}
.sticky__price small{display:block;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--taupe-dark)}
.sticky__price b{font-size:17px;font-weight:300}

/* ===== Sub-páginas ===== */
.page{min-height:100vh}
.subhero{background:var(--ink-deep);color:#fff;padding:120px 0 70px;position:relative;overflow:hidden}
.subhero::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#c9b39a,#6f6558);opacity:.35}
.subhero__in{position:relative}
.subhero h1{font-family:var(--font-serif);font-size:clamp(36px,5vw,60px);line-height:1.08;margin-top:16px}
.subhero p{margin-top:18px;max-width:520px;font-size:15px;line-height:1.7;color:rgba(255,255,255,.72)}
.back{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:rgba(255,255,255,.7)}
.back:hover{color:#fff}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:-46px;position:relative;z-index:5}
.info{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius-lg);padding:26px}
.info b{display:block;font-size:15px;margin-top:8px;font-weight:500}
.info span{display:block;margin-top:6px;font-size:13px;color:var(--ink-soft);line-height:1.6}
.form{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:660px}
.form .full{grid-column:1/-1}
.field label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe-dark);font-weight:500}
.field input,.field select,.field textarea{width:100%;margin-top:8px;padding:14px 16px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;font-family:inherit}
.field textarea{min-height:110px;resize:vertical}

/* ===== SEO visible: breadcrumbs, FAQ, enlazado interno ===== */
/* Se ven poco pero pesan: el breadcrumb emite BreadcrumbList, el FAQ emite
   FAQPage y el bloque de sedes cercanas es enlazado interno entre landings. */
.crumbs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11px;
  letter-spacing:.06em;color:rgba(255,255,255,.6)}
.crumbs a:hover{color:#fff;text-decoration:underline}
.crumbs span[aria-current]{color:#fff}
.crumbs__sep{opacity:.45}
.faq{max-width:820px;border-top:1px solid var(--line)}
.faq__item{border-bottom:1px solid var(--line)}
.faq__q{width:100%;display:flex;align-items:flex-start;justify-content:space-between;gap:24px;
  padding:24px 4px;text-align:left;font-size:17px;line-height:1.4;transition:color .2s}
.faq__q:hover{color:var(--taupe-dark)}
.faq__sign{flex:none;font-size:20px;font-weight:300;line-height:1;color:var(--taupe-dark);transition:transform .3s}
.faq__item--open .faq__sign{transform:rotate(45deg)}
.faq__a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease}
.faq__item--open .faq__a{grid-template-rows:1fr}
.faq__a-in{overflow:hidden}
.faq__a p{padding:0 4px 24px;font-size:14px;line-height:1.75;color:var(--ink-soft);max-width:660px}
.nearby{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.nearby a{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius-pill);font-size:12px;transition:.2s}
.nearby a:hover{border-color:var(--taupe);transform:translateY(-1px)}

/* ===== Reveal ===== */
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}
.rv--in{opacity:1;transform:none}

/* ===== Nota de prototipo ===== */
.proto{position:fixed;left:14px;bottom:14px;z-index:400;background:var(--ink-deep);color:rgba(255,255,255,.8);
  font-size:10px;letter-spacing:.06em;padding:9px 14px;border-radius:var(--radius-pill);
  box-shadow:var(--shadow-soft);display:flex;align-items:center;gap:9px;max-width:calc(100vw - 28px)}
.proto b{color:#fff;font-weight:500}
.proto button{color:rgba(255,255,255,.5);font-size:14px;line-height:1}

/* ===== Responsive ===== */
@media (max-width:1024px){
  .hero__grid{grid-template-columns:1fr;gap:44px}
  .method,.app__grid{grid-template-columns:1fr;gap:48px}
  .method__media{aspect-ratio:16/10}
  .quotes,.plans,.sedes,.info-grid,.trial{grid-template-columns:repeat(2,1fr)}
  .ftr__grid{grid-template-columns:1fr 1fr;gap:40px}
}
@media (max-width:768px){
  body{font-size:13px}
  .container{padding:0 20px}
  .section{padding:76px 0}
  .section-head h2,.method h2,.app h2{font-size:34px}
  .hdr__nav,.hdr__login,.hdr__cta,.hdr__tag{display:none}
  .hdr__burger{display:block;color:#fff}
  .hdr--solid .hdr__burger{color:var(--ink)}
  .hero__inner{padding-top:120px;padding-bottom:34px}
  .hero__stats{gap:26px}
  .hero__stat b{font-size:24px}
  .levels,.quotes,.plans,.sedes,.split,.info-grid,.form,.trial{grid-template-columns:1fr}
  .level{min-height:0;padding:34px 28px}
  .card-cta{padding:38px 28px;min-height:280px}
  .sticky{display:flex}
  .proto{bottom:calc(84px + env(safe-area-inset-bottom));left:10px;font-size:9px;padding:7px 11px}
  body{padding-bottom:78px}
  .hero{min-height:auto}
  .hero__inner{padding-top:112px;padding-bottom:44px}
  .ftr__grid{grid-template-columns:1fr;gap:34px}
  .row{column-gap:14px;padding:14px 16px}
  .row__time{font-size:20px;min-width:54px;padding-right:14px}
  .row__name{font-size:16px}
  .row__arrow{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
  .rv{opacity:1;transform:none}
}
</style>

/* PRNG determinista: mismas clases en cada carga, sin depender de random. */
function seeded(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}

/** Espeja GET /api/public/sedes/:id/clases → Clase[] */
function getClases(sedeId){
  const rnd=seeded(sedeId*7919);
  const out=[];const ahora=new Date();
  for(let d=0;d<7;d++){
    const dia=new Date(ahora);dia.setDate(ahora.getDate()+d);
    const dow=dia.getDay();
    const horas=dow===0?[]:dow===6?[9,10,11,12]:[7,8,9,10,11,12,17,18,19,20];
    horas.forEach(h=>{
      const r=rnd();
      if(r<0.18)return;                         // hueco real en la grilla
      const inicio=new Date(dia);inicio.setHours(h,r<0.5?0:30,0,0);
      if(inicio<ahora)return;                   // no mostramos clases pasadas
      const act=ACTIVIDADES[r<0.62?0:1];
      const cupo=r<0.12?0:Math.max(0,Math.round(rnd()*8));
      out.push({
        id:sedeId*1000+d*100+h,
        inicio:inicio.toISOString(),
        actividad:act,
        salon:{id:1,nombre:'Salón Reformer'},
        instructor:INSTRUCTORAS[Math.floor(rnd()*INSTRUCTORAS.length)],
        cuposDisponibles:cupo,
      });
    });
  }
  return out.sort((a,b)=>a.inicio.localeCompare(b.inicio));
}

/* Redondeo a mil, para que los precios derivados no queden con cifras raras. */
const redondear=n=>n==null?null:Math.round(n*1e-3)*1000;
const escalarPrecios=(p,f)=>({
  transferencia:redondear(p.transferencia*f),efectivo:redondear(p.efectivo*f),
  debito:redondear(p.debito*f),tarjeta:redondear(p.tarjeta*f),
});

/**
 * Espeja GET /api/public/catalogo?sede=<slug> → CatalogoSede.
 * Cada sede publica su propio catálogo: los planes son los mismos, los precios no.
 */
function getCatalogo(sedeId){
  const s=SEDES.find(x=>x.id===sedeId);
  return {
    sedeId:s.id,sedeNombre:s.nombre,sedeSlug:s.slug,
    caracteristicas:[],
    tipos:CATALOGO_BASE.map(t=>({
      ...t,
      precios:escalarPrecios(t.precios,s.f),
      flexible:t.flexible?{...t.flexible,precios:escalarPrecios(t.flexible.precios,s.f)}:null,
    })),
  };
}

/** Precio del plan más barato de la red, para los "desde $X". */
function planDesde(){
  return Math.min(...SEDES.map(s=>getCatalogo(s.id).tipos[0].precios.transferencia));
}

function etiquetaDia(iso){
  const d=new Date(iso),hoy=new Date();
  const mismo=(a,b)=>a.toDateString()===b.toDateString();
  const man=new Date(hoy);man.setDate(hoy.getDate()+1);
  if(mismo(d,hoy))return'Hoy';
  if(mismo(d,man))return'Mañana';
  return DIAS[d.getDay()]+' '+d.getDate();
}

function grillaClases(sedeId,limitDays){
  const sede=SEDES.find(s=>s.id===sedeId);
  const clases=getClases(sedeId);
  if(!clases.length)return`<div class="empty"><h4>No quedan clases publicadas</h4><p>Escribinos por WhatsApp y te ubicamos en la próxima.</p></div>`;
  const grupos={};
  clases.forEach(c=>{const k=etiquetaDia(c.inicio);(grupos[k]=grupos[k]||[]).push(c)});
  return Object.keys(grupos).slice(0,limitDays||3).map(k=>
    `<div class="day-label">${k}</div>${grupos[k].slice(0,limitDays?99:5).map(c=>claseRow(c,sede)).join('')}`
  ).join('');
}

      <div class="manifesto__word" style="margin-top:16px">
        <h2>CLIC</h2>
        <span class="manifesto__pron">/klik/</span>
      </div>
      <div class="manifesto__rule"></div>
      <p class="manifesto__def"><b>Hacer el clic.</b> Momento de transformación en el que decidís priorizarte, conectar con tu cuerpo y reencontrarte a través del movimiento.</p>
      <p class="manifesto__foot">No le ponemos el nombre a un estudio: se lo ponemos a ese instante. Todo lo que hacemos —el método, los grupos chicos, las nueve sedes, la app— existe para que ese clic te pase, y para que después te resulte fácil sostenerlo.</p>

    <div class="container method rv">

      <div>
        <div class="eyebrow">El método</div>
        <h2>Contrología, como fue pensada.</h2>
        <p>Trabajamos Pilates Clásico: el orden original de los ejercicios, la respiración que los sostiene y la progresión que Joseph Pilates diseñó. No es una clase de moda con música fuerte — es una práctica precisa que se vuelve tuya.</p>
        <div class="method__list">
          <div class="method__item"><div class="method__num">01</div><div><h4>Grupos de hasta ocho</h4><p>La instructora te ve. Corrige postura, ajusta resortes y adapta el ejercicio a tu cuerpo, clase por clase.</p></div></div>
          <div class="method__item"><div class="method__num">02</div><div><h4>Instructoras de nuestra academy</h4><p>Todas se forman en CLIC Academy y siguen capacitándose. Mismo criterio en los nueve estudios.</p></div></div>
          <div class="method__item"><div class="method__num">03</div><div><h4>Progresión real</h4><p>Empezás en Initial y pasás a Level Up cuando el cuerpo está listo, no cuando pasan los meses.</p></div></div>
        </div>
      </div>

      <div class="section-head rv">
        <div class="eyebrow">Niveles</div>
        <h2>Dos formas de entrar.</h2>
        <p>No hace falta experiencia previa. Hace falta empezar por el lugar correcto.</p>
      </div>
      <div class="levels rv">
        <div class="level level--a">
          <div class="eyebrow">Para arrancar</div>
          <h3>Initial Pilates</h3>
          <p>La base del método a un ritmo que te deja entender cada movimiento. Ideal si nunca hiciste reformer o volvés después de una pausa larga.</p>
          <ul><li>Sin experiencia previa</li><li>Foco en técnica y respiración</li><li>Corrección individual</li></ul>
          <div class="level__foot"><a class="btn btn--ghost" href="#/reservar">Reservar una clase</a></div>
        </div>
        <div class="level level--b">
          <div class="eyebrow eyebrow--light">Para seguir</div>
          <h3>Level Up Pilates</h3>
          <p>Secuencias más largas, más carga y menos pausas. Entrás cuando tu instructora ve que la base está sólida.</p>
          <ul><li>Requiere base de Initial</li><li>Mayor intensidad y fluidez</li><li>Repertorio intermedio y avanzado</li></ul>
          <div class="level__foot"><a class="btn btn--light" href="#/reservar">Ver horarios</a></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section" style="background:var(--surface)">
    <div class="container">
      <div class="section-head rv">
        <div class="eyebrow">Lo que dicen</div>
        <h2>4.9 en Google, en nueve estudios.</h2>
      </div>
      <div class="quotes rv">
        ${TESTIMONIOS.map(t=>`<div class="quote">
          <div class="quote__stars">★★★★★</div>
          <div class="quote__text">“${t.texto}”</div>
          <div class="quote__by"><div class="quote__av"></div><div><div class="quote__name">${t.nombre}</div><div class="quote__sede">${t.sede}</div></div></div>
        </div>`).join('')}
      </div>
    </div>
  </section>

  <section class="section" id="prueba">
    <div class="container">
      <div class="section-head rv">
        <div class="eyebrow">Cómo empezás</div>
        <h2>La clase de prueba se descuenta del plan.</h2>
        <p>Se abona al reservar, porque así el lugar queda tomado. Si después seguís, ese valor no lo pagás de nuevo.</p>
      </div>
      <div class="rv">${bloquePrueba(null)}</div>
    </div>
  </section>

  <section class="section" id="precios" style="background:var(--surface)">
    <div class="container">
      <div class="section-head rv">
        <div class="eyebrow">Precios</div>
        <h2>Cada estudio tiene su lista.</h2>
        <p>Los valores cambian según el estudio. Elegí el tuyo y mirá exactamente lo que vas a pagar — sin llamar ni escribir para preguntar.</p>
      </div>
      <div class="price-picker rv">
        <span class="price-picker__label">Estudio</span>
        <select class="book__select" id="precioSede" style="max-width:340px;background-color:var(--bg)">
          ${SEDES.map(s=>`<option value="${s.slug}">${s.nombre} · ${s.ciudad}</option>`).join('')}
        </select>
      </div>
      <div class="plans rv" id="precioPlans"></div>
      <p class="muted rv" id="precioNota" style="margin-top:26px;font-size:12px"></p>
    </div>
  </section>

  <section class="section" id="estudios" style="background:var(--surface)">
    <div class="container">
      <div class="section-head rv">
        <div class="eyebrow">Estudios</div>
        <h2>Nueve estudios, uno cerca tuyo.</h2>
        <p>Cada estudio tiene su propia grilla, su equipo y su clase de prueba. Entrá al que te queda cómodo y reservá directo.</p>
      </div>
      <div class="sedes rv">${SEDES.map(sedeCard).join('')}</div>
    </div>
  </section>

function pageSede(slug){
  const s=sedeBySlug(slug);
  if(!s)return pageNotFound();
  return `<div class="page">
    <section class="subhero">
      <div class="container subhero__in">
        <nav class="crumbs" aria-label="Ruta de navegación">
          <a href="#/">Inicio</a><span class="crumbs__sep">/</span>
          <a href="#/#estudios">Estudios</a><span class="crumbs__sep">/</span>
          <span aria-current="page">${s.nombre}</span>
        </nav>
        <div class="eyebrow eyebrow--light" style="margin-top:26px">${s.ciudad}</div>
        <h1>Pilates reformer<br/>en ${zona(s)}</h1>
        <p>CLIC ${s.nombre} — ${s.direccion}, ${s.ciudad}. Pilates Clásico en reformer, en grupos de hasta ocho personas, de lunes a sábado.</p>
      </div>
    </section>
    <div class="container">
      <div class="info-grid">
        <div class="info"><div class="eyebrow">Clase de prueba</div><b>${money(s.precioPrueba)}</b><span>Se abona al reservar y se descuenta del plan si seguís.</span></div>
        <div class="info"><div class="eyebrow">Dirección</div><b>${s.direccion}</b><span><a href="${s.googleMapsUrl}" target="_blank" rel="noopener" style="text-decoration:underline">Abrir en Google Maps</a></span></div>
        <div class="info"><div class="eyebrow">WhatsApp</div><b>${s.tel}</b><span>Consultas de horarios y planes, de lunes a sábado.</span></div>
      </div>
    </div>
    <section class="section">
      <div class="container">
        <div class="section-head"><div class="eyebrow">Disponibilidad real</div><h2>Próximas clases en ${s.nombre}</h2><p>Los cupos salen del mismo sistema con el que trabaja el estudio. Lo que ves acá es lo que hay.</p></div>
        ${grillaClases(s.id,7)}
      </div>
    </section>
    <section class="section" style="background:var(--surface)">
      <div class="container">
        <div class="section-head">
          <div class="eyebrow">Cómo empezás en ${s.nombre}</div>
          <h2>Probás una vez, y si seguís no la pagás dos.</h2>
        </div>
        ${bloquePrueba(s)}
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <div class="eyebrow">Planes en ${s.nombre}</div>
          <h2>Elegí tu frecuencia.</h2>
          <p>Estos son los valores de este estudio. Cada sede publica su propia lista.</p>

        <div class="plans">${getCatalogo(s.id).tipos.map(t=>planCard(t,s)).join('')}</div>

    </section>
    <section class="section" style="background:var(--surface)">
      <div class="container">
        <div class="section-head">
          <div class="eyebrow">Preguntas frecuentes</div>
          <h2>Sobre entrenar en ${zona(s)}.</h2>
        </div>
        ${bloqueFaq(faqsSede(s))}
        <div style="margin-top:56px">
          <div class="eyebrow">Otros estudios cerca</div>
          <div class="nearby">
            ${sedesCerca(s).map(o=>`<a href="#/estudios/${o.slug}">CLIC ${o.nombre} <span style="color:var(--ink-mute)">${o.ciudad}</span></a>`).join('')}
          </div>
        </div>
      </div>
    </section>
    ${footer()}
  </div>`;
}

/* ============================================================================
   ROUTER + COMPORTAMIENTO
   ========================================================================== */
function render(){
  const raw=location.hash.replace(/^#/,'')||'/';
  const [path,anchor]=raw.split('#');
  const parts=path.split('/').filter(Boolean);
  let html;
  if(parts.length===0)html=pageHome();
  else if(parts[0]==='estudios'&&parts[1])html=pageSede(parts[1]);
  else if(parts[0]==='reservar')html=pageReservar();
  else if(parts[0]==='franquicias')html=pageFranquicias();
  else if(parts[0]==='academy')html=pageAcademy();
  else if(parts[0]==='mi-cuenta')html=pageCuenta();
  else html=pageNotFound();

  $('#app').innerHTML=html;
  closeMenu();
  wire();
  observeReveals();

  if(anchor){
    requestAnimationFrame(()=>{const el=document.getElementById(anchor);if(el)el.scrollIntoView({behavior:'smooth'})});
  }else{
    window.scrollTo({top:0,behavior:'instant'});
  }
  updateHeader();
}

function wire(){
  // selector de sede del hero
  const sel=$('#heroSede');
  if(sel){
    const sync=()=>{
      const s=sedeBySlug(sel.value);
      const clases=getClases(s.id).filter(c=>c.cuposDisponibles>0);
      const next=clases[0];
      const peek=$('#heroPeek');
      peek.lastElementChild.textContent=next
        ? `${etiquetaDia(next.inicio)} ${hora(next.inicio)} · ${next.actividad.nombre} · quedan ${next.cuposDisponibles}`
        : 'Sin cupos publicados — escribinos por WhatsApp';
      $('#heroCta').setAttribute('href','#/estudios/'+s.slug);
      $('#stickyPrice').textContent=money(s.precioPrueba);
      $('#heroNote').innerHTML=`Clase de prueba ${money(s.precioPrueba)} · <b style="font-weight:500">se descuenta del plan</b>`;
      // La sección de precios sigue al selector del hero: una sola sede elegida
      // en toda la página, como pasa en la cabeza del que la está mirando.
      const psel=$('#precioSede');
      if(psel&&psel.value!==s.slug){psel.value=s.slug;psel.dispatchEvent(new Event('change'))}
    };
    sel.addEventListener('change',sync);sync();
  }else{
    $('#stickyPrice').textContent=money(precioDesde());
  }

  // selector de la sección de precios
  const psel=$('#precioSede');
  if(psel){
    const syncPrecios=()=>{
      const s=sedeBySlug(psel.value);
      $('#precioPlans').innerHTML=getCatalogo(s.id).tipos.map(t=>planCard(t,s)).join('');
      $('#precioNota').innerHTML=`En ${s.nombre} la clase de prueba sale ${money(s.precioPrueba)} y se descuenta del primer mes. Valores de ejemplo hasta conectar el catálogo real.`;
    };
    psel.addEventListener('change',syncPrecios);syncPrecios();
  }

  // pills de sede
  const pills=$('#livePills');
  if(pills){
    pills.addEventListener('click',e=>{
      const b=e.target.closest('.pill');if(!b)return;
      pills.querySelectorAll('.pill').forEach(p=>p.classList.remove('pill--active'));
      b.classList.add('pill--active');
      const days=location.hash.includes('reservar')?7:0;
      $('#liveGrid').innerHTML=grillaClases(Number(b.dataset.sede),days||undefined);
    });
  }

  // filas de clase → llevan al checkout
  document.querySelectorAll('.row').forEach(r=>{
    r.addEventListener('click',()=>{location.hash='#/reservar'});
  });

  // acordeón de preguntas frecuentes
  document.querySelectorAll('[data-faq] .faq__q').forEach(q=>{
    q.addEventListener('click',()=>q.parentElement.classList.toggle('faq__item--open'));
  });
}

/* header transparente sobre el hero, sólido al scrollear */
function updateHeader(){
  const hdr=$('#hdr');
  const hasHero=!!$('.hero')||!!$('.subhero');
  const solid=window.scrollY>60||!hasHero;
  hdr.classList.toggle('hdr--solid',solid);
  $('#sticky').classList.toggle('sticky--on',window.scrollY>420);
}

function observeReveals(){
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('rv--in');io.unobserve(e.target)}})
  },{threshold:.12,rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('.rv').forEach(el=>io.observe(el));
}

function openMenu(){$('#mnav').classList.add('mnav--open');document.body.style.overflow='hidden'}
function closeMenu(){$('#mnav').classList.remove('mnav--open');document.body.style.overflow=''}

$('#burger').addEventListener('click',openMenu);
$('#mclose').addEventListener('click',closeMenu);
$('#protoX').addEventListener('click',()=>$('#proto').remove());
window.addEventListener('scroll',updateHeader,{passive:true});
window.addEventListener('hashchange',render);
render();
</script>
